name: Production smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-smoke-tests
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check code quality
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Wait for production deployment
        run: |
          for attempt in {1..42}; do
            deployed_sha="$(curl --fail --silent --show-error https://progressgym-sigma.vercel.app/api/health | jq -r '.commit // empty' || true)"
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Production is running commit $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for commit $GITHUB_SHA (currently: ${deployed_sha:-unavailable})"
            sleep 10
          done
          echo "Production did not reach commit $GITHUB_SHA in time"
          exit 1

      - name: Run smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://progressgym-sigma.vercel.app
        run: npm run test:e2e:prod

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
