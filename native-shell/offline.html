<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Sin conexión | Progrezzia</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111111; color: #f5f2ee; }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { color: #d9d9d9; line-height: 1.5; }
      button { min-height: 3rem; margin-top: .75rem; border: 0; border-radius: .75rem; padding: 0 1.25rem; background: #c98796; color: #111111; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <h1>Estás sin conexión</h1>
      <p>Revisá internet y volvé a intentar. Los cambios del entrenamiento que ya estaban en el teléfono se conservan.</p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
