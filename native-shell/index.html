<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Progrezzia</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111111; color: #f5f2ee; }
      main { max-width: 22rem; padding: 2rem; text-align: center; }
      .mark { display: grid; width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; place-items: center; border-radius: 1rem; background: #c98796; color: #111111; font-size: 1.5rem; font-weight: 900; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { color: #d9d9d9; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↗</div>
      <h1>Progrezzia</h1>
      <p>Preparando tu entrenamiento…</p>
    </main>
  </body>
</html>
